<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя PDF-библиотека</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
    ul { list-style: none; padding: 0; }
    li { margin: 12px 0; padding: 14px; background: #f8f9fa; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    a { text-decoration: none; color: #0366d6; font-weight: bold; font-size: 18px; }
    a:hover { text-decoration: underline; }
    .size { font-size: 13px; color: #666; }
  </style>
</head>
<body>

  <h1>📚 Моя библиотека</h1>
  <ul id="book-list"><li>Загрузка списка книг...</li></ul>

  <script>
    const USER = "yusu-source"; // ЗАМЕНИТЕ НА СВОЙ
    const REPO = "online_books"; // ЗАМЕНИТЕ НА СВОЙ
    const FOLDER = "books";

    async function loadBooks() {
      const listEl = document.getElementById("book-list");
      try {
        const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${FOLDER}`);
        if (!res.ok) {
          throw new Error(`GitHub API ответил ${res.status}` + (res.status === 403 ? " (лимит запросов, попробуйте через час)" : ""));
        }
        const files = await res.json();

        const books = files.filter(f => f.name.toLowerCase().endsWith(".pdf"));

        if (books.length === 0) {
          listEl.innerHTML = "<li>В папке books пока нет PDF-файлов.</li>";
          return;
        }

        listEl.innerHTML = books.map(book => {
          const title = book.name.replace(/\.pdf$/i, "");
          const sizeMB = (book.size / (1024 * 1024)).toFixed(1);
          // Путь указываем относительно папки web/, где лежит viewer.html
          // Кодируем каждую часть пути, чтобы работали пробелы, кириллица, # и т.п. в именах файлов
          const fileUrl = "../" + book.path.split("/").map(encodeURIComponent).join("/");
          const viewerUrl = `web/viewer.html?file=${encodeURIComponent(fileUrl)}`;

          return `
            <li>
              <a href="${viewerUrl}">${title}</a>
              <span class="size">${sizeMB} МБ</span>
            </li>
          `;
        }).join("");
      } catch (e) {
        console.error(e);
        listEl.innerHTML = `<li>Ошибка загрузки: ${e.message}. Проверьте логин, имя репозитория и наличие папки books.</li>`;
      }
    }

    loadBooks();
  </script>
</body>
</html>
